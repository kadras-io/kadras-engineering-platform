#@ load("@ytt:data", "data")

#! RBAC for kapp-controller to install all the platform packages, which create cluster-wide resources
#! like CustomResourceDefinitions, webhooks, and ClusterRoles.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadras-install-cluster-admin
  annotations:
    kapp.k14s.io/change-group: serviceaccount
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kadras-install-sa
    namespace: #@ data.values.namespace

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kadras-install-sa
  namespace: #@ data.values.namespace
  annotations:
    kapp.k14s.io/change-group: serviceaccount
