#@data/values-schema
#@schema/validation ("the packages required by the installed packages to be installed too", required_packages_installed), ("`kyverno` to be installed when `policies.enabled` is true", kyverno_installed_for_policies)
---

#@schema/desc "The installation profile. `run` for clusters exposing the applications via a load balancer. `local` for local clusters like kind and k3d: the default domain is `127.0.0.1.sslip.io`, the Gateway is exposed via the node ports 30080 (HTTP) and 30443 (HTTPS), and Metrics Server accepts the self-signed Kubelet certificates."
#@schema/validation one_of=["run", "local"]
profile: run

#@schema/desc "The namespace where the PackageInstalls of the platform packages are created. The packages deploy their workloads in their own namespaces."
#@schema/validation ("a valid DNS label", is_dns_label)
namespace: kadras-system

#! =============================================
#! Packages
#! =============================================

#@schema/desc "The packages to install, in addition to or instead of the default ones."
packages:
  #@schema/desc "The optional packages to install."
  include:
    #@schema/validation one_of=package_names
    - ""
  #@schema/desc "The default packages not to install."
  exclude:
    #@schema/validation one_of=package_names
    - ""

#! =============================================
#! Ingress
#! =============================================

#@schema/desc "Settings for exposing the applications outside the cluster, via the external Gateway of Envoy Gateway."
ingress:
  #@schema/desc "The base domain of the applications, served over HTTPS. Knative Services are served as `<name>.<workspace>.<domain>`. When empty, the `local` profile uses `127.0.0.1.sslip.io`, while the `run` profile serves no domain over HTTPS."
  #@schema/examples ("Custom domain", "example.com")
  #@schema/validation ("a valid DNS name, like `example.com`", lambda v: v == "" or is_dns_name(v))
  domain: ""
  #@schema/desc "The cert-manager ClusterIssuer that issues the certificates for `*.<domain>` and `*.<workspace>.<domain>`. The default one uses the private CA of the cert-manager package. For Let's Encrypt, wildcard certificates require a DNS-01 challenge: see docs/ingress.md."
  #@schema/examples ("Let's Encrypt", "letsencrypt-prod-issuer")
  issuer: kadras-ca-issuer

#! =============================================
#! Workspaces
#! =============================================

#@schema/desc "The namespaces where the platform users deploy their workloads, provisioned by the Workspace Provisioner package. Each workspace gets its own HTTPS hostname on the external Gateway."
workspaces:
  -
    #@schema/desc "The name of the namespace. It's created if it doesn't exist."
    #@schema/validation ("a valid DNS label", is_dns_label)
    name: ""
    #@schema/desc "The Pod Security Standard enforced on the namespace. When empty, `restricted`, unless configured otherwise in `workspace_provisioner.pod_security.level`."
    pod_security: ""
    #@schema/desc "The users and groups granted access to the workspace, each with a `kind` (`User` or `Group`), a `name`, and a `role` (`admin`, `edit`, or `view`)."
    #@schema/type any=True
    members: []

#! =============================================
#! Shared settings
#! =============================================

#@schema/desc "PEM-encoded certificates of additional certificate authorities to trust, for example to reach a private OCI registry or Git server. Applied to all the packages supporting it."
ca_cert_data: ""

#@schema/desc "Settings for logs, metrics, and traces, applied to all the packages supporting them."
observability:
  logging:
    #@schema/desc "The log level."
    #@schema/validation one_of=["info", "debug"]
    level: info
    #@schema/desc "The log format, for the packages where it's configurable."
    #@schema/validation one_of=["json", "text"]
    format: json
  metrics:
    #@schema/desc "Whether the components produce metrics."
    enabled: true
    #@schema/desc "How the metrics are exported. With `prometheus`, the Pods are annotated for scraping. With `otlp`, Envoy Gateway, Knative Serving, and Kyverno push them to `endpoint`, while the other packages keep exposing them for scraping."
    #@schema/validation one_of=["prometheus", "otlp"]
    exporter: prometheus
    #@schema/desc "The OTLP/gRPC endpoint of an in-cluster OpenTelemetry collector, with the `otlp` exporter."
    #@schema/examples ("OpenTelemetry collector", "http://otel-collector.observability.svc:4317")
    #@schema/validation min_len=1, when=lambda _, ctx: ctx.parent["enabled"] and ctx.parent["exporter"] == "otlp"
    endpoint: ""
  tracing:
    #@schema/desc "Whether Envoy Gateway, Knative Serving, and Kyverno export traces via OTLP/gRPC."
    enabled: false
    #@schema/desc "The OTLP/gRPC endpoint of an in-cluster OpenTelemetry collector."
    #@schema/examples ("OpenTelemetry collector", "http://otel-collector.observability.svc:4317")
    #@schema/validation min_len=1, when=lambda _, ctx: ctx.parent["enabled"]
    endpoint: ""
    #@schema/desc "The fraction of requests to trace, from 0 (never) to 1 (always), for Envoy Gateway and Knative Serving."
    #@schema/validation min=0.0, max=1.0
    sampling_rate: 1.0

#@schema/desc "Settings for the Kyverno policies included in the packages, like the verification of their image signatures."
policies:
  #@schema/desc "Whether to include the Kyverno policies, in the packages supporting them. It requires the `kyverno` package."
  enabled: false

#@schema/desc "Settings for the security of the platform workloads."
security:
  #@schema/desc "Whether to restrict the inbound traffic to the platform workloads via NetworkPolicies, in the packages supporting them."
  network_policies: false

#@schema/desc "Settings for the corporate proxy, applied to all the packages supporting it."
proxy:
  #@schema/desc "The HTTP proxy to use for network traffic."
  http_proxy: ""
  #@schema/desc "The HTTPS proxy to use for network traffic."
  https_proxy: ""
  #@schema/desc "A comma-separated list of hostnames, IP addresses, or IP ranges in CIDR format that should not use the proxy. Include the in-cluster domains."
  #@schema/examples ("Bypass the proxy for in-cluster traffic", ".cluster.local.,.cluster.local,.svc,10.0.0.0/8")
  no_proxy: ""

#! =============================================
#! Packages configuration
#! =============================================

#! The configuration of each package, merged on top of the values computed by the platform. See the documentation of each package.

#@schema/desc "Configuration for the cert-manager package. See https://github.com/kadras-io/package-for-cert-manager."
#@schema/type any=True
cert_manager: {}

#@schema/desc "Configuration for the cert-manager-webhook-hetzner package. See https://github.com/kadras-io/package-for-cert-manager-webhook-hetzner."
#@schema/type any=True
cert_manager_webhook_hetzner: {}

#@schema/desc "Configuration for the Crossplane package. See https://github.com/kadras-io/package-for-crossplane."
#@schema/type any=True
crossplane: {}

#@schema/desc "Configuration for the Dependency Track package. See https://github.com/kadras-io/package-for-dependency-track."
#@schema/type any=True
dependency_track: {}

#@schema/desc "Configuration for the Developer Portal package. See https://github.com/kadras-io/package-for-developer-portal."
#@schema/type any=True
developer_portal: {}

#@schema/desc "Configuration for the Envoy Gateway package. See https://github.com/kadras-io/package-for-envoy-gateway."
#@schema/type any=True
envoy_gateway: {}

#@schema/desc "Configuration for the Flagger package. See https://github.com/kadras-io/package-for-flagger."
#@schema/type any=True
flagger: {}

#@schema/desc "Configuration for the Flux package. See https://github.com/kadras-io/package-for-flux."
#@schema/type any=True
flux: {}

#@schema/desc "Configuration for the GitOps Configurer package. See https://github.com/kadras-io/gitops-configurer."
#@schema/type any=True
gitops_configurer: {}

#@schema/desc "Configuration for the Knative Serving package. See https://github.com/kadras-io/package-for-knative-serving."
#@schema/type any=True
knative_serving: {}

#@schema/desc "Configuration for the Kyverno package. See https://github.com/kadras-io/package-for-kyverno."
#@schema/type any=True
kyverno: {}

#@schema/desc "Configuration for the Metrics Server package. See https://github.com/kadras-io/package-for-metrics-server."
#@schema/type any=True
metrics_server: {}

#@schema/desc "Configuration for the OpenTelemetry Operator package. See https://github.com/kadras-io/package-for-opentelemetry-operator."
#@schema/type any=True
opentelemetry_operator: {}

#@schema/desc "Configuration for the PostgreSQL Operator package. See https://github.com/kadras-io/package-for-postgresql-operator."
#@schema/type any=True
postgresql_operator: {}

#@schema/desc "Configuration for the RabbitMQ Operator package. See https://github.com/kadras-io/package-for-rabbitmq-operator."
#@schema/type any=True
rabbitmq_operator: {}

#@schema/desc "Configuration for the secretgen-controller package. See https://github.com/kadras-io/package-for-secretgen-controller."
#@schema/type any=True
secretgen_controller: {}

#@schema/desc "Configuration for the Workspace Provisioner package. See https://github.com/kadras-io/workspace-provisioner."
#@schema/type any=True
workspace_provisioner: {}
