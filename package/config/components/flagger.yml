#@ load("@ytt:data", "data")
#@ load("@ytt:struct", "struct")
#@ load("@ytt:yaml", "yaml")
#@ load("/helpers.star", "is_package_additional")

#@ if is_package_additional("flagger"):

#@ def compute_package_values():
#@   values = struct.decode(data.values.flagger)
#@   return struct.encode(values)
#@ end

---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: flagger
  namespace: #@ data.values.platform.namespace
  annotations:
    kapp.k14s.io/change-group: flagger
    kapp.k14s.io/change-rule.contour: upsert after upserting contour
    kapp.k14s.io/change-rule.knative-serving: upsert after upserting knative-serving
    kapp.k14s.io/change-rule.serviceaccount: delete before deleting serviceaccount
spec:
  serviceAccountName: kadras-install-sa
  packageRef:
    refName: flagger.packages.kadras.io
    versionSelection:
      constraints: 1.42.0
  values:
    - secretRef:
        name: flagger-values
---
apiVersion: v1
kind: Secret
metadata:
  name: flagger-values
  namespace: #@ data.values.platform.namespace
stringData:
  values.yaml: #@ yaml.encode(compute_package_values())

#@ end
