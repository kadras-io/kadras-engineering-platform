---
# A Knative Service in a workspace enforcing the restricted Pod Security Standard: Knative sets the secure defaults,
# like `runAsNonRoot`. The image doesn't declare a user, so it runs with a non-root one.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: apps
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go
          securityContext:
            runAsUser: 1001
          env:
            - name: TARGET
              value: Kadras
