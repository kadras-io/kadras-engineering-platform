---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kadras-install-sa
  namespace: tests

---
# kapp-controller installs the platform with the cluster-admin role, since it creates cluster-wide resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadras-install-cluster-admin-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kadras-install-sa
    namespace: tests
