# The optional packages aren't installed.
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: kyverno
---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: metrics-server
---
# The Gateway API package has no values.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-api-values
---
# Change rules only reference the installed packages.
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: cert-manager
  annotations:
    (contains(keys(@), 'kapp.k14s.io/change-rule.upsert-kyverno')): true
---
# The built-in cluster-admin role is used, rather than an equivalent one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
